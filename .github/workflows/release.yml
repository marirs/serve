name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            cross: false
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            cross: true
          # macOS: only the Apple-silicon runner — Intel runners are retired.
          # Both arches are produced here; x86_64 is a cross-compile.
          - os: macos-latest
            target: aarch64-apple-darwin
            cross: false
          - os: macos-latest
            target: x86_64-apple-darwin
            cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            cross: false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (cargo)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/serve
          tar -C "$(dirname "$bin")" -czf serve-${{ matrix.target }}.tar.gz serve
          shasum -a 256 serve-${{ matrix.target }}.tar.gz > serve-${{ matrix.target }}.tar.gz.sha256

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/serve.exe"
          Compress-Archive -Path $bin -DestinationPath "serve-${{ matrix.target }}.zip"
          (Get-FileHash "serve-${{ matrix.target }}.zip" -Algorithm SHA256).Hash | Out-File "serve-${{ matrix.target }}.zip.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            serve-${{ matrix.target }}.*

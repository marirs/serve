<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{CODE} {MESSAGE}</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.5 system-ui, sans-serif; margin: 0; min-height: 100vh;
         display: flex; align-items: center; justify-content: center; }
  .box { text-align: center; padding: 2rem; }
  .code { font-size: 4rem; font-weight: 700; letter-spacing: -.03em; }
  .msg { font-size: 1.2rem; color: #888; margin-top: .25rem; }
  a { display: inline-block; margin-top: 1.5rem; color: #2563eb; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="box">
  <div class="code">{CODE}</div>
  <div class="msg">{MESSAGE}</div>
  <a href="/">&larr; Back to index</a>
</div>
</body>
</html>
